name: cyr_app_kit
description: Reusable Flutter app kit built on cyr_flutter_core - bootstrap, auth token refresh, FCM push, theme, and common widgets.
version: 0.1.0
homepage: https://github.com/hainguyen-ar1/cyr_app_kit
repository: https://github.com/hainguyen-ar1/cyr_app_kit
issue_tracker: https://github.com/hainguyen-ar1/cyr_app_kit/issues
topics:
  - flutter
  - dio
  - theme
  - push-notification
  - fcm

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  cyr_flutter_core: ^0.1.0

  dio: ^5.7.0
  flutter_bloc: ^9.1.1
  go_router: ^14.6.3
  get_it: ^9.2.1
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  chuck_interceptor: ^2.4.0
  curl_logger_dio_interceptor: ^1.0.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
